    <!-- SEO Meta Tags -->

    <meta name="robots" content="index, follow" />

    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Asset Preload & Font Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Schema.org JSON-LD Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FlowIntel.AI",
        "description": "Business Workflow Detection & Diagram Generation",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "name": "Free Demo"
        },
        "featureList": [
          "Unstructured natural language to DAG workflow generation",
          "Interactive React Flow dynamic studio canvas",
          "Real-time 3D neural AST topology visualizer",
          "Latency hotspot and bottleneck risk diagnostics",
          "Straight-Through Processing (STP) auto-optimization"
        ]
      }
    </script>

    <!-- Schema.org JSON-LD Structured Data: HowTo -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HowTo",
        "name": "How to Detect and Generate Business Workflows from Unstructured Text",
        "description": "Step-by-step procedure used by FlowIntel.AI to convert messy SOP documents into mathematical DAG diagrams.",
        "step": [
          {
            "@type": "HowToStep",
            "name": "Ingest Business Description",
            "text": "Paste natural language requirements or SOP text into the discovery prompt."
          },
          {
            "@type": "HowToStep",
            "name": "Entity & Schema Extraction",
            "text": "AI extracts actors, actions, validation gates, and MongoDB target collections."
          },
          {
            "@type": "HowToStep",
            "name": "DAG Topology Construction",
            "text": "AI constructs an interactive Directed Acyclic Graph with guaranteed 0 cycles."
          },
          {
            "@type": "HowToStep",
            "name": "Execute and Optimize",
            "text": "Simulate STP optimization to reduce cycle delays by up to 94%."
          }
        ]
      }
    </script>

    <!-- Schema.org JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is FlowIntel.AI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FlowIntel.AI is an autonomous AI agent system designed to detect and generate executable Directed Acyclic Graph (DAG) diagrams from unstructured natural language business descriptions."
            }
          },
          {
            "@type": "Question",
            "name": "How does FlowIntel.AI guarantee zero cycles in DAGs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FlowIntel.AI uses an integrated topological sort engine that isolates cyclic exception loops into explicit error-handling paths, ensuring the core pipeline always executes without deadlocks."
            }
          },
          {
            "@type": "Question",
            "name": "Can I export workflows to other formats?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, FlowIntel.AI supports one-click export to high-resolution PNG, vector PDF, and structured JSON schemas ready for CI/CD and API pipelines."
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#0a0e1a] text-[#e8edf5] min-h-screen overflow-x-hidden antialiased selection:bg-[#00d4ff]/30 selection:text-[#00d4ff]">

    <div id="root"></div>
